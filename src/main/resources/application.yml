spring:
  application:
    name: log-analyzer

  # ==================== DATABASE ====================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/log_analyzer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LogAnalyzerHikariPool

  # ==================== JPA ====================
  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

        jdbc:
          batch_size: 50

        order_inserts: true
        order_updates: true

  # ==================== FLYWAY ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true

  # ==================== JACKSON ====================
  jackson:
    serialization:
      write-dates-as-timestamps: false

    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# ==================== SERVER ====================
server:
  port: ${PORT:8080}

  servlet:
    context-path: /api

# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}

  metrics:
    export:
      prometheus:
        enabled: true

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    com.loganalyzer: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ==================== APP CUSTOM CONFIG ====================
app:

  # ==================== JWT ====================
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

  # ==================== AI ====================
  ai:
    max-logs: 100
    max-chars: 12000
    max-compressed-logs: 25
    max-message-length: 180

    streaming-delay-ms: 40

    max-retries: 2

    queue-capacity: 500

    core-pool-size: 4
    max-pool-size: 8
    keep-alive-seconds: 60

    cache-confidence: 90

  # ==================== FILE UPLOAD ====================
  upload:
    max-file-size: 10MB
    allowed-types: text/plain,application/octet-stream

  # ==================== RATE LIMIT ====================
  rate-limit:
    max-requests: 5
    window-minutes: 1
    daily-limit: 100

# ==================== OPENAI ====================
openai:
  api:
    key: ${OPENAI_API_KEY}

  model: gpt-4o-mini

# ==================== CORS ====================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ==================== STORAGE ====================
storage:
  type: local
  base-path: ${STORAGE_BASE_PATH:uploads}
