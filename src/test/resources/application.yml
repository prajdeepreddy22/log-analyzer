spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: jdbc:h2:mem:log_analyzer_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

openai:
  api:
    key: test-key

app:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9nLWFuYWx5emVyLXRlc3Rz
    expiration: 86400000
